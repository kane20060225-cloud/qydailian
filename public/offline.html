<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="QY Blitz">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260917-b24">
    <title>暂时离线 | QY Blitz</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #0a0f1a; color: #e2e8f0; font-family: system-ui, sans-serif; }
        main { max-width: 460px; padding: 32px; border: 1px solid #1e2a3a; border-radius: 16px; background: #141b26; }
        h1 { font-size: 24px; }
        p { color: #a0aec0; line-height: 1.8; }
        a { display: inline-block; padding: 12px 18px; margin-top: 12px; border-radius: 10px; background: #f0a050; color: #141414; text-decoration: none; }
        a:focus-visible { outline: 2px solid white; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <strong>QY Blitz</strong>
        <h1>暂时无法连接网络</h1>
        <p>请检查网络连接后重试。登录、订单、支付和用户信息需要联网，不会在此显示离线副本。</p>
        <p>如果刚才正在提交订单或付款，请联网后先查看订单状态，避免重复提交。</p>
        <a href="/">重新连接</a>
    </main>
</body>
</html>
